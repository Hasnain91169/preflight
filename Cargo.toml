[package]
name = "preflight"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Hasnain Javed"]
description = "Screen text before it reaches an LLM: redact PII and flag likely prompt injection."
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[profile.release]
lto = true
strip = true
